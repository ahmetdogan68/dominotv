<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRTI TV - HAZIR</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#070b14;color:#fff;font-family:Arial;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#playerArea{background:#000;position:relative;height:36vh;min-height:200px}
#player{width:100%;height:100%;background:#000}
#bar{position:absolute;bottom:0;left:0;right:0;padding:6px 10px;background:rgba(0,0,0,0.8);display:flex;justify-content:space-between;font-size:11px;z-index:2}
#topBar{padding:8px;background:#0b1120;border-bottom:2px solid #ff0a16;display:flex;align-items:center;gap:8px}
#main{flex:1;display:flex;overflow:hidden}
#left{width:120px;min-width:120px;background:#0b1120;border-right:1px solid #1e2d4a;display:flex;flex-direction:column}
#mid{flex:1;background:#0e1424;display:flex;flex-direction:column}
.mainCat{padding:8px 2px;background:#151d32;margin:2px;border-radius:6px;text-align:center;cursor:pointer;font-size:10px;border:1px solid #1e2d4a}
.mainCat.active{background:#ff0a16}
#groupList{flex:1;overflow-y:auto;padding:4px}
.group{padding:10px 4px;background:#1a2340;margin:3px 0;border-radius:6px;cursor:pointer;font-size:11px;border:1px solid #1e2d4a;text-align:center}
.group.active{background:#ff0a16}
#channelHeader{padding:8px;background:#ff0a16;font-weight:bold;display:flex;justify-content:space-between;font-size:12px}
#channelList{flex:1;overflow-y:auto;padding:5px}
.ch{padding:12px;background:#1a2340;margin:5px 0;border-radius:8px;cursor:pointer;border:1px solid #1e2d4a;display:flex;gap:10px;align-items:center}
.ch.active{background:#ff0a16}
.ch img{width:46px;height:46px;border-radius:6px;background:#000;object-fit:contain}
#settings{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:400px;background:#0b1120;border-left:3px solid #ff0a16;z-index:50;transform:translateX(100%);transition:.3s;padding:12px;overflow-y:auto}
#settings.open{transform:translateX(0)}
input{width:100%;padding:10px;border-radius:6px;border:1px solid #1e2d4a;background:#060a14;color:#fff;margin-top:5px}
.btn{width:100%;padding:10px;background:#ff0a16;color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:5px}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070b14;z-index:5;text-align:center;padding:20px}
#debug{position:absolute;top:5px;left:5px;background:rgba(0,0,0,0.9);padding:6px 10px;border-radius:6px;font-size:10px;color:#0f0;z-index:10;max-width:90%}
</style>
</head>
<body>
<div id="playerArea">
<div id="empty"><h2 style="color:#ff0a16">MIRTI TV HAZIR</h2><p style="font-size:11px;color:#8aa">Liste yükleniyor...</p></div>
<div id="debug" style="display:none"></div>
<video id="player" controls playsinline webkit-playsinline referrerpolicy="no-referrer"></video>
<div id="bar"><span id="now">Kanal seç</span><span id="pType">Hazır</span></div>
</div>
<div id="topBar">
<b style="color:#ff0a16">MIRTI TV</b><span id="failInfo" style="font-size:10px;color:#ff0a16;margin-left:10px"></span>
<button onclick="toggleSet()" style="margin-left:auto;background:#ff0a16;border:none;color:#fff;padding:6px 12px;border-radius:5px">⚙️ LİSTE</button>
</div>
<div id="main">
<div id="left">
<div class="mainCat active" onclick="setMain('Tümü')">Tümü</div>
<div class="mainCat" onclick="setMain('Canlı')">CANLI</div>
<div class="mainCat" onclick="setMain('Film')">FİLM</div>
<div class="mainCat" onclick="setMain('Dizi')">DİZİ</div>
<div id="groupList"></div>
</div>
<div id="mid">
<div id="channelHeader"><span id="midTitle">KANALLAR</span><span id="midCount">0</span></div>
<input id="search" placeholder="🔍 Ara..." style="margin:5px;padding:10px;background:#060a14;border:1px solid #1e2d4a;border-radius:6px;color:#fff">
<div id="channelList"></div>
</div>
</div>
<div id="settings">
<div style="display:flex;justify-content:space-between"><b style="color:#ff0a16">AYARLAR</b><button onclick="toggleSet()" style="background:#ff0a16;border:none;color:#fff;padding:6px 12px;border-radius:5px">X</button></div>
<input id="urlInput" value="https://tinyurl.com/Fiat-linea-multijet/Emu/androstreamlivebs1.m3u8">
<button class="btn" onclick="loadUrl()">YÜKLE</button>
<label for="fileInput" style="display:block;text-align:center;color:#ff0a16;border:2px dashed #ff0a16;padding:16px;border-radius:8px;margin-top:8px">📁 DOSYADAN SEÇ</label><input type="file" id="fileInput" accept=".m3u,.txt" style="display:none">
<div id="status" style="font-size:11px;color:#0f0;margin-top:8px;padding:8px;background:#060a14;border-radius:6px">Hazır</div>
</div>
<script>
let all=[]; let hls=null; let mpegPlayer=null; let mainCat='Tümü'; let activeGroup='Tümü'; const video=document.getElementById('player');
function toggleSet(){document.getElementById('settings').classList.toggle('open');}
function catOf(n,g){let s=(n+' '+g).toLowerCase();if(/film|movie|vod/.test(s))return 'Film';if(/dizi|series/.test(s))return 'Dizi';return 'Canlı';}
function splitPipe(url){
  if(!url.includes('|')) return {url, headers:{}};
  let [base, query] = url.split('|');
  let headers={};
  query.split('&').forEach(p=>{ let [k,v]=p.split('='); if(k&&v) headers[k.trim().toLowerCase()]=decodeURIComponent(v.trim()); });
  return {url:base.trim(), headers};
}
function parseM3U(text){
  const lines=text.split(/\r?\n/); const out=[]; let tmp={name:'',group:'Genel',logo:'',referrer:''}; let lastRef='';
  for(let l of lines){l=l.trim();if(!l)continue;
    if(l.startsWith('#EXTVLCOPT:http-referrer=')){lastRef=l.split('=')[1]||'';continue;}
    if(l.startsWith('#EXTINF')){
      tmp.name=l.split(',').pop().trim()||'';
      let gM=l.match(/group-title="([^"]+)"/); tmp.group=gM?gM[1].trim():'Genel';
      tmp.logo=(l.match(/tvg-logo="([^"]+)"/)||[])[1]||'';
      let r1=(l.match(/http-referrer="([^"]+)"/)||[])[1]||'';
      tmp.referrer=r1||lastRef||'';
      if(lastRef) lastRef='';
    }else if(!l.startsWith('#')&&l.startsWith('http')){
      if(!tmp.name) tmp.name='Kanal '+(out.length+1);
      let parsed=splitPipe(l);
      out.push({name:tmp.name,group:tmp.group,logo:tmp.logo,cat:catOf(tmp.name,tmp.group),url:parsed.url,referrer:tmp.referrer||parsed.headers.referrer||parsed.headers.referer||''});
      tmp={name:'',group:'Genel',logo:'',referrer:''};
    }
  } return {channels:out};
}
async function fetchDirect(url){try{let r=await fetch(url,{cache:'no-store'});if(r.ok){let t=await r.text();if(t.length>50) return t;}}catch(e){}
const ps=['https://api.allorigins.win/raw?url='+encodeURIComponent(url),'https://corsproxy.io/?'+encodeURIComponent(url)];
for(let p of ps){try{let r=await fetch(p);if(r.ok){let t=await r.text();if(t.length>50) return t;}}catch(e){}}throw 'CORS';}
async function loadUrl(){let u=document.getElementById('urlInput').value.trim();if(!u)return;document.getElementById('status').textContent='Yükleniyor...';
try{let txt=await fetchDirect(u);let res=parseM3U(txt);if(res.channels.length){all=res.channels;apply();document.getElementById('empty').style.display='none';document.getElementById('status').textContent=res.channels.length+' kanal yüklendi';}else{document.getElementById('status').textContent='Kanal bulunamadı';}}catch(e){document.getElementById('status').textContent='Yüklenemedi: '+e;}}
function apply(){document.getElementById('empty').style.display='none';buildGroups();}
function setMain(cat){mainCat=cat;document.querySelectorAll('.mainCat').forEach(t=>t.classList.toggle('active',t.textContent.includes(cat)));activeGroup='Tümü';buildGroups();}
function buildGroups(){
  let base=all.filter(c=>mainCat==='Tümü'||c.cat===mainCat);
  let groups=['Tümü',...new Set(base.map(c=>c.group))].filter(Boolean);
  const box=document.getElementById('groupList'); box.innerHTML='';
  groups.forEach(g=>{
    let cnt=g==='Tümü'?base.length:base.filter(x=>x.group===g).length;
    let b=document.createElement('div'); b.className='group'+(activeGroup===g?' active':''); b.textContent=g+' ('+cnt+')';
    b.onclick=()=>{activeGroup=g;document.querySelectorAll('.group').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderCh();};
    box.appendChild(b);
  });
  renderCh();
}
function renderCh(){
  let base=all.filter(c=>mainCat==='Tümü'||c.cat===mainCat);
  let list=base.filter(c=>activeGroup==='Tümü'||c.group===activeGroup);
  let q=document.getElementById('search').value.toLowerCase(); if(q) list=list.filter(c=>c.name.toLowerCase().includes(q));
  const box=document.getElementById('channelList'); box.innerHTML='';
  document.getElementById('midTitle').textContent=activeGroup; document.getElementById('midCount').textContent=list.length;
  list.forEach(c=>{
    let d=document.createElement('div'); d.className='ch';
    d.innerHTML=`<img src="${c.logo}" onerror="this.src='https://via.placeholder.com/46/0b1120/ff0a16?text=TV'"><div style="flex:1;min-width:0"><div style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:bold">${c.name}</div><div style="font-size:10px;color:#8aa">${c.group}</div></div><span>▶</span>`;
    d.onclick=()=>{document.querySelectorAll('.ch').forEach(x=>x.classList.remove('active'));d.classList.add('active');playWithRetry(c,0);};
    box.appendChild(d);
  });
}
const PROXIES = [
  url => url,
  url => 'https://corsproxy.io/?'+encodeURIComponent(url),
  url => 'https://api.allorigins.win/raw?url='+encodeURIComponent(url),
  url => 'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(url)
];
function showDebug(msg){let d=document.getElementById('debug'); d.style.display='block'; d.textContent=msg; setTimeout(()=>d.style.display='none',4000);}
function playWithRetry(c, attempt){
  if(attempt===0){document.getElementById('empty').style.display='none';document.getElementById('now').textContent=c.name;}
  if(attempt >= PROXIES.length){document.getElementById('pType').textContent='Açılamadı';document.getElementById('failInfo').textContent='Açılamadı: '+c.name;showDebug('4 deneme başarısız.');return;}
  let url = PROXIES[attempt](c.url);
  document.getElementById('pType').textContent='Deneme '+(attempt+1)+'/4...';
  showDebug('Deneniyor '+(attempt+1));
  if(hls){try{hls.destroy()}catch(e){} hls=null;}
  if(mpegPlayer){try{mpegPlayer.destroy()}catch(e){} mpegPlayer=null;}
  video.pause(); video.removeAttribute('src'); video.load();
  if(c.url.includes('.ts') && attempt===0 && typeof mpegts!=='undefined' && mpegts.isSupported()){
    try{
      mpegPlayer=mpegts.createPlayer({type:'mse', isLive:true, url:url});
      mpegPlayer.attachMediaElement(video); mpegPlayer.load();
      mpegPlayer.play().then(()=>{document.getElementById('pType').textContent='MPEG-TS Oynatılıyor';}).catch(()=>{playWithRetry(c, attempt+1);});
      mpegPlayer.on(mpegts.Events.ERROR, ()=>{playWithRetry(c, attempt+1);});
      return;
    }catch(e){ playWithRetry(c, attempt+1); return; }
  }
  if(Hls.isSupported()){
    hls=new Hls({enableWorker:true, fragLoadingMaxRetry:2});
    hls.loadSource(url);
    hls.attachMedia(video);
    let timeout=setTimeout(()=>{ try{hls.destroy()}catch(e){}; playWithRetry(c, attempt+1); }, 8000);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{clearTimeout(timeout);video.play().then(()=>{document.getElementById('pType').textContent='Oynatılıyor';showDebug('Açıldı!');}).catch(()=>{document.getElementById('pType').textContent='Videoya dokun';});});
    hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal){ clearTimeout(timeout); try{hls.destroy()}catch(e){}; playWithRetry(c, attempt+1); }});
  }else{
    video.src=url; video.play().then(()=>{document.getElementById('pType').textContent='Oynatılıyor';}).catch(()=>{playWithRetry(c, attempt+1);});
  }
}
document.getElementById('fileInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{let res=parseM3U(ev.target.result);if(res.channels.length){all=res.channels;apply();document.getElementById('empty').style.display='none';}};r.readAsText(f);});
document.getElementById('search').addEventListener('input',renderCh);
window.onload=()=>{loadUrl();};
</script>
</body>
</html>
